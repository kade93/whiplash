# Tag push (v1.0, v1.1 …) → GitHub Release with the Windows and Linux builds of desktop/ (Electron).
# macOS is not built here: the Mac app ships through the Mac App Store (./release.sh appstore).
# The two jobs are independent, so a failure on one platform never blocks the other's upload.
# Note: Releases are only reachable by others once the repository is public (Settings ▸ General ▸ Danger zone).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
defaults:
  run:
    working-directory: desktop
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets and private-path check
        working-directory: .
        run: bash tools/secrets-check.sh && bash tools/secrets-check.sh --history
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Build AppImage and tar.gz
        run: npm run dist:linux
      - name: Smoke test (starts the app headless, captures a screenshot, exits)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2 > /dev/null
          chmod +x dist/*.AppImage
          WHIPLASH_DEMO=1 WHIPLASH_SNAPSHOT="$PWD/smoke" WHIPLASH_SNAPSHOT_QUIT=1 WHIPLASH_CONFIG_DIR="$PWD/smoke-cfg" \
            timeout 60 xvfb-run -a ./dist/*.AppImage --no-sandbox || echo "smoke test skipped (exit $?)"
          ls smoke || true
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
          generate_release_notes: true

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Build zip (portable, no install)
        run: npm run dist:win
      - name: Build MSI installer (optional)
        continue-on-error: true
        run: npm run dist:win:msi
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.zip
            desktop/dist/*.msi
          generate_release_notes: true
